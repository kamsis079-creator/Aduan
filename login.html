<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Sistem Aduan Kamsis PMS</title>
    <style>
        /* ==========================================
           EMBEDDED CSS STYLING (SAME BASE DESIGN)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Centers the login box vertically */
        }
        .container {
            width: 100%;
            max-width: 450px; /* Narrower width for login page */
            padding: 0 1rem;
        }
        header {
            text-align: center;
            background-color: #003366; /* PMS Corporate Blue */
            color: white;
            padding: 2rem;
            border-radius: 8px 8px 0 0;
        }
        .form-section {
            background: white;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 0 0 8px 8px;
        }
        h2 {
            color: #003366;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 0.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            background-color: #e67e22; /* PMS Orange */
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #d35400;
        }
        .error-msg {
            background-color: #ffcccc;
            color: #cc0000;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ff9999;
            display: none; /* Hidden by default in HTML version */
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #003366;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>Sistem Aduan</h1>
            <p>Politeknik Muadzam Shah (PMS)</p>
        </header>

        <!-- FORM SECTION -->
        <section class="form-section">
            <h2>Log Masuk Staf</h2>

            <!-- Display Error Message (Visible if ?error=1 is in URL) -->
            <div class="error-msg" id="errorMessage">
                Katalaluan tidak sah atau pengguna tidak wujud! Sila cuba lagi.
            </div>

            <!-- Note: Action URL changed to admin.html for static demonstration -->
            <form action="admin.html" method="POST">
                <div class="form-group">
                    <label for="username">ID Pengguna (Username):</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Katalaluan (Password):</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-submit">Log Masuk</button>

                <!-- Link back to the student homepage -->
                <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
            </form>
        </section>
    </div>

    <!-- Script to handle error message display based on URL parameter for static HTML demo -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === '1') {
            document.getElementById('errorMessage').style.display = 'block';
        }
    </script>
</body>
</html>
